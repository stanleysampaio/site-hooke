name = "hooke-news"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Sem cron: a geração das matérias roda na EC2 (../news-pipeline).
# Secrets: ADMIN_PASSWORD (painel) e INGEST_TOKEN (pipeline) — `wrangler secret put <NOME>`.

# Notícias, leituras e inscritos da newsletter (schema em schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "hooke-news"
database_id = "281acc54-e237-4731-b8df-cef50484cab2"

# Só o pedido "gerar agora" e o resumo da última execução (e os dados antigos, antes da migração).
[[kv_namespaces]]
binding = "NEWS_KV"
id = "644af31eb80a4920bb1da76762032474"
